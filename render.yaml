services:
  - type: web
    name: rugpull
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn main:app --bind 0.0.0.0:$PORT --workers 1 --threads 4 --timeout 300
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
      - key: EMBEDDING_DEVICE
        value: cpu
      - key: UMAP_N_JOBS
        value: "1"
      - key: CACHE_DIR
        value: ./cache
